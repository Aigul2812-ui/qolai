<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QolAI</title>
<meta name="description" content="QolAI">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#ECE7DD; --paper-dark:#DFD9C9; --card:#F7F4EC; --ink:#22271F; --ink-soft:#5B6152;
    --border:#CBC2AC; --green:#3F6B3A; --green-soft:#E4ECDE; --amber:#B8712E; --amber-soft:#F3E4D2;
    --slate:#3F5468; --slate-soft:#E2E8ED; --rust:#9C4A32;
    --font-display:'Bricolage Grotesque', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  ::placeholder{color:#9a9484;}
  button{font-family:var(--font-body); cursor:pointer;}
  select,input,textarea{font-family:var(--font-body);}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--slate); outline-offset:1px;}

  header{border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--paper); z-index:10;}
  /* two fixed rows — identical structure in all languages:
     row 1: logo ... region;  row 2: offer, card, mode, language */
  .header-inner{max-width:1080px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap;}
  .logo-row{order:1; display:flex; align-items:center; gap:10px;}
  .logo-badge{width:34px; height:34px; border-radius:8px; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:16px;}
  .logo-text{font-family:var(--font-display); font-weight:900; font-size:20px; letter-spacing:-0.3px;}
  .logo-text span{color:var(--amber);}
  .region-row{order:2; margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap;}
  .header-row-break{order:3; flex-basis:100%; width:100%; height:0; margin:0; padding:0;}
  #offerHeaderBtn{order:4;}
  #cardHeaderBtn{order:5;}
  .mode-group{order:6;}
  .lang-group{order:7;}
  .card-btn{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; color:var(--ink);}
  .mode-group, .lang-group{display:flex; border-radius:10px; border:1px solid var(--border); overflow:hidden;}
  .mode-btn{padding:8px 14px; border:none; background:#fff; color:var(--ink-soft); font-size:13px; font-weight:600;}
  .mode-btn.mode-active.mode-client{background:var(--slate); color:#fff;}
  .mode-btn.mode-active.mode-worker{background:var(--amber); color:#fff;}
  .lang-btn{padding:8px 10px; border:none; background:#fff; color:var(--ink-soft); font-size:12px; font-weight:700;}
  .lang-btn.lang-active{background:var(--ink); color:var(--paper);}

  /* mobile: compact 2 rows —
     row 1: logo | offer+card (icons only) | language;  row 2: mode full width */
  @media (max-width:859px){
    .header-inner{padding:10px 14px; gap:8px;}
    .region-row, .header-row-break{display:none;}
    #offerHeaderBtn{order:2; padding:8px 10px;}
    #cardHeaderBtn{order:3; padding:8px 10px;}
    .lang-group{order:4; margin-left:auto;}
    .mode-group{order:5; flex-basis:100%; width:100%;}
    .card-btn .btn-label{display:none;}
    .mode-btn{flex:1 1 0; text-align:center; padding:9px 8px;}
    .logo-badge{width:30px; height:30px; font-size:14px;}
    .logo-text{font-size:18px;}
    .lang-btn{padding:7px 9px; font-size:11.5px;}
    .cat-row{padding:12px 14px 0;}
    main{padding:14px 14px 60px;}
    .task-card{padding:12px;}
    .task-card-title{font-size:15px;}
    .price-mono{font-size:16px;}
  }

  .cat-row{max-width:1080px; margin:0 auto; padding:14px 20px 0; display:flex; gap:8px; overflow-x:auto;}
  .pill{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--ink-soft); font-size:13px; font-weight:500; white-space:nowrap; transition:all .15s ease;}
  .pill.pill-active{border-color:var(--ink); background:var(--ink); color:var(--paper);}

  .flash-row{max-width:1080px; margin:10px auto 0; padding:0 20px; display:none;}
  .flash{background:var(--green-soft); color:var(--green); padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}

  main{max-width:1080px; margin:0 auto; padding:16px 20px 60px;}
  .grid{display:grid; grid-template-columns:1fr; gap:20px;}
  @media (min-width:860px){ .grid{grid-template-columns:1.6fr 1fr; align-items:start;} }

  .empty-msg{color:var(--ink-soft); font-size:14px; padding:24px 0;}

  .task-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; margin-bottom:12px;}
  .task-card.task-card-sel{border-color:var(--ink); box-shadow:0 2px 0 0 var(--ink);}
  .task-card-top{display:flex; justify-content:space-between; gap:10px;}
  .task-card-main{flex:1; min-width:0;}
  .task-card-meta{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft);}
  .tag{font-size:11px; padding:1px 7px; border-radius:999px; font-weight:600;}
  .tag-slate{background:var(--slate-soft); color:var(--slate);}
  .tag-green{background:var(--green-soft); color:var(--green);}
  .task-card-title{font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.3;}
  .task-card-price{text-align:right; flex-shrink:0;}
  .price-mono{font-family:var(--font-mono); font-weight:600; font-size:18px;}
  .bids-hint{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .side-panel .panel-inner{position:sticky; top:90px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px;}
  .panel-title{font-family:var(--font-display); font-weight:700; font-size:16px; display:flex; align-items:center; gap:6px;}
  .panel-sub{font-size:12px; color:var(--ink-soft); margin:2px 0 12px;}
  .form-col{display:flex; flex-direction:column; gap:10px;}
  .label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:4px;}
  .input{width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:14px; color:var(--ink); outline:none;}
  .input.mono{font-family:var(--font-mono);}
  .textarea{min-height:64px; resize:vertical;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-primary{margin-top:4px; padding:11px 14px; border-radius:8px; border:none; background:var(--ink); color:var(--paper); font-weight:700; font-size:14px;}
  .btn-amber{display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 14px; border-radius:8px; border:none; background:var(--amber); color:#fff; font-weight:700; font-size:14px;}
  .btn-small{font-size:12px; font-weight:600; border:none; background:var(--ink); color:var(--paper); padding:6px 10px; border-radius:6px;}
  .quick-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .chip-btn{font-size:11px; border:1px solid var(--border); background:#fff; border-radius:999px; padding:3px 9px;}
  .muted{font-size:13px; color:var(--ink-soft);}
  .panel-hint{color:var(--ink-soft); font-size:14px;}

  .bids-title{font-size:13px; font-weight:600; margin-bottom:8px;}
  .bids-list{display:flex; flex-direction:column; gap:8px;}
  .bid-row{border:1px solid var(--border); border-radius:8px; padding:10px; background:#fff;}
  .bid-row.bid-accepted{border-color:var(--green); background:var(--green-soft);}
  .bid-row-top{display:flex; justify-content:space-between; align-items:center;}
  .bid-worker{font-weight:600; font-size:13px;}
  .delta{display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px;}
  .delta-neutral{color:var(--ink-soft); background:var(--paper-dark);}
  .delta-good{color:var(--green); background:var(--green-soft);}
  .delta-bad{color:var(--rust); background:var(--amber-soft);}
  .bid-amount{font-size:15px; margin:4px 0; font-family:var(--font-mono);}
  .bid-note{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .accepted-mark{font-size:12px; color:var(--green); font-weight:600;}

  .detail-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .detail-sub{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
  .detail-budget{font-size:20px; font-weight:600; margin-bottom:4px; font-family:var(--font-mono);}
  .detail-payment{font-size:12px; color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:4px;}

  .icon-btn{background:none; border:none; color:var(--ink-soft);}
  .icon-btn.danger{color:var(--rust);}

  .modal-overlay{position:fixed; inset:0; background:rgba(34,39,31,0.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .modal{background:var(--card); border-radius:14px; padding:20px; width:100%; max-width:380px; max-height:90vh; overflow-y:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .card-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .card-row{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:8px; padding:8px 10px;}
  .card-row-main{background:none; border:none; text-align:left; flex:1; display:flex; align-items:center; gap:8px; color:var(--ink);}
  .card-row-title{font-size:13px; font-weight:600;}
  .default-tag{font-size:10px; color:var(--green); font-weight:600;}
  .card-row-sub{font-size:11px; color:var(--ink-soft);}
  .card-preview{background:linear-gradient(135deg, var(--slate), var(--ink)); border-radius:12px; padding:16px; color:#fff; margin-bottom:14px; font-family:var(--font-mono);}
  .preview-number{font-size:15px; letter-spacing:2px; margin-bottom:18px;}
  .preview-row{display:flex; justify-content:space-between; font-size:11px; opacity:0.85;}
  .error-text{font-size:12px; color:var(--rust);}
  .fine-print{font-size:11px; color:var(--ink-soft); line-height:1.4;}
  .offer-body p{font-size:13px; line-height:1.5; margin:0 0 10px;}
  .offer-body p.offer-commission{background:var(--amber-soft); border-radius:8px; padding:10px 12px; font-weight:600;}

  .pyatak-badge{font-size:12px; color:var(--amber); font-weight:700; margin-left:2px;}
  .divider{border-top:1px solid var(--border); margin:16px 0;}
  .pyatak-widget{margin-bottom:2px;}
  .pyatak-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .pyatak-row{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--amber-soft); border-radius:8px; padding:8px 10px;}
  .pyatak-row-main{min-width:0;}
  .pyatak-name{font-weight:600; font-size:13px;}
  .pyatak-meta{font-size:11px; color:var(--ink-soft);}
  .pyatak-box{margin-top:16px; padding-top:16px; border-top:1px solid var(--border);}
  .pyatak-status{background:var(--green-soft); color:var(--green); padding:10px; border-radius:8px; font-size:13px; margin-bottom:10px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-inner">
      <div class="logo-row">
        <div class="logo-badge">Q</div>
        <div class="logo-text">Qol<span>AI</span></div>
      </div>
      <div class="region-row">
        <span>&#128205;</span>
        <span data-i18n="regionLabel"></span>
        <span id="pyatakBadge" class="pyatak-badge"></span>
      </div>
      <div class="header-row-break" aria-hidden="true"></div>
      <button id="offerHeaderBtn" class="card-btn" onclick="openOfferModal()">
        <span id="offerHeaderIcon"></span>
        <span class="btn-label" data-i18n="offerBtn"></span>
      </button>
      <button id="cardHeaderBtn" class="card-btn" onclick="openCardModal()">
        <span id="cardHeaderIcon"></span>
        <span class="btn-label" id="cardHeaderLabel"></span>
      </button>
      <div class="mode-group">
        <button id="modeClientBtn" class="mode-btn mode-client mode-active" data-i18n="modeClient" onclick="setMode('client')"></button>
        <button id="modeWorkerBtn" class="mode-btn mode-worker" data-i18n="modeWorker" onclick="setMode('worker')"></button>
      </div>
      <div class="lang-group" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="kk" onclick="setLang('kk')">Қаз</button>
        <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">Рус</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">Eng</button>
      </div>
    </div>
  </header>

  <div id="catRow" class="cat-row"></div>
  <div id="flashRow" class="flash-row"></div>

  <main>
    <div class="grid">
      <div id="feed" class="feed"></div>
      <div class="side-panel"><div id="sidePanel"></div></div>
    </div>
  </main>

  <div id="cardModalOverlay" class="modal-overlay" onclick="closeCardModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="panel-title" style="margin:0" data-i18n="payMethods"></div>
        <button class="icon-btn" onclick="closeCardModal()" id="cardModalCloseBtn"></button>
      </div>
      <div id="cardListBox"></div>
      <div class="card-preview">
        <div id="previewNumber" class="preview-number">•••• •••• •••• ••••</div>
        <div class="preview-row">
          <span id="previewName"></span>
          <span id="previewExpiry"></span>
        </div>
      </div>
      <div class="form-col">
        <div>
          <label class="label" data-i18n="cardNumber"></label>
          <input id="cardNumber" class="input" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" autocomplete="off" oninput="onCardNumberInput()">
        </div>
        <div class="two-col">
          <div>
            <label class="label" data-i18n="cardExpiry"></label>
            <input id="cardExpiry" class="input" data-i18n-ph="cardExpiryPh" maxlength="5" inputmode="numeric" autocomplete="off" oninput="onCardExpiryInput()">
          </div>
          <div>
            <label class="label">CVC</label>
            <input id="cardCvc" type="password" class="input" placeholder="123" maxlength="3" inputmode="numeric" autocomplete="off" oninput="onCardCvcInput()">
          </div>
        </div>
        <div>
          <label class="label" data-i18n="cardName"></label>
          <input id="cardName" class="input" placeholder="IVAN IVANOV" autocomplete="off" oninput="updateCardPreview()">
        </div>
        <div id="cardError" class="error-text"></div>
        <button class="btn-primary" data-i18n="cardLink" onclick="addCard()"></button>
        <div class="fine-print" data-i18n="cardFinePrint"></div>
      </div>
    </div>
  </div>

  <div id="offerModalOverlay" class="modal-overlay" onclick="closeOfferModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="panel-title" style="margin:0" data-i18n="offerTitle"></div>
        <button class="icon-btn" onclick="closeOfferModal()" id="offerModalCloseBtn"></button>
      </div>
      <div id="offerBodyBox" class="offer-body"></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* =====================================================================
   i18n: Қазақша / Русский / English
   ===================================================================== */
const LANGS = ["kk", "ru", "en"];
const LOCALE = { ru: "ru-RU", kk: "kk-KZ", en: "en-US" };
const N = (ru, kk, en) => ({ ru: ru, kk: kk, en: en });

const I18N = {
  docTitle: N("QolAI — доска задач Алматинской области", "QolAI — Алматы облысының тапсырмалар тақтасы", "QolAI — task board for Almaty Region"),
  docDesc: N(
    "QolAI — сервис для поиска и заказа любой работы в Алматинской области: мастера, разнорабочие, домашние услуги. Заказчик называет цену, исполнитель соглашается или предлагает свою.",
    "QolAI — Алматы облысында кез келген жұмысты табу және тапсыру сервисі: шеберлер, көмекші жұмысшылар, үй қызметтері. Тапсырыс беруші бағаны атайды, орындаушы келіседі немесе өз бағасын ұсынады.",
    "QolAI — a service for finding and ordering any kind of work in Almaty Region: skilled trades, laborers, home services. The client names a price; the worker accepts or offers their own."
  ),
  regionLabel: N("Алматинская область", "Алматы облысы", "Almaty Region"),
  offerBtn: N("Оферта", "Оферта", "Offer"),
  offerTitle: N("Публичная оферта", "Жалпы оферта", "Public offer"),
  offerP1: N(
    "Настоящий документ является публичной офертой (предложением) сервиса QolAI — доски задач по поиску и заказу исполнителей в Алматинской области. Начиная пользоваться сервисом, заказчик или исполнитель считается согласившимся с условиями настоящей оферты в полном объёме.",
    "Бұл құжат — Алматы облысында орындаушы табу және тапсыру тапсырмалар тақтасы QolAI сервисінің публичтік офертасы (ұсынысы). Сервисті пайдалануды бастаған сәттен бастап тапсырыс беруші немесе орындаушы осы оферта шарттарына толық келіскен деп танылады.",
    "This document is the public offer of QolAI — the task board for finding and ordering workers in Almaty Region. By using the service, the client or the worker is deemed to have accepted the terms of this offer in full."
  ),
  offerP2: N(
    "Комиссия сервиса составляет 5% от суммы оплаты за выполненную задачу. Комиссия удерживается из суммы оплаты перед передачей средств исполнителю: заказчик платит согласованную цену, исполнитель получает 95% от неё.",
    "Сервистің комиссиясы — орындалған тапсырма үшін төлем сомасының 5%-ы. Комиссия төлем сомасынан орындаушыға ақша жеткізілмей тұрып ұсталады: тапсырыс беруші келісілген бағаны төлейді, орындаушы оның 95%-ын алады.",
    "The service fee is 5% of the payment for a completed task. The fee is withheld from the payment before the funds are transferred to the worker: the client pays the agreed price, and the worker receives 95% of it."
  ),
  offerP3: N(
    "Комиссия начисляется автоматически после подтверждения заказчиком завершения задачи. Если задача не выполнена или стороны расторгли договор, комиссия не взимается.",
    "Комиссия тапсырыс беруші тапсырманы аяқталғанын растаған соң автоматты түрде алынады. Егер тапсырма орындалмаса немесе тараптар келісімнен бас тартса, комиссия алынбайды.",
    "The fee is charged automatically after the client confirms the task is complete. If the task is not completed or the parties cancel the agreement, no fee is charged."
  ),
  offerP4: N(
    "Условия оферты могут быть изменены сервисом. Изменения публикуются в приложении и вступают в силу с момента публикации. Продолжая пользоваться сервисом после публикации изменений, пользователь подтверждает согласие с новыми условиями.",
    "Оферта шарттарын сервис өзгертуі мүмкін. Өзгерістер қосымшада жарияланады және жарияланған сәттен күшіне енеді. Өзгерістер жарияланғаннан кейін сервисті пайдалануды жалғастырған қолданушы жаңа шарттарға келісетінін растайды.",
    "The terms of this offer may be changed by the service. Changes are published in the app and take effect upon publication. By continuing to use the service after changes are published, you confirm your agreement to the new terms."
  ),
  cardLink: N("Привязать карту", "Картаны байлау", "Link card"),
  modeClient: N("Мне нужна работа", "Орындаушы іздеймін", "I need work done"),
  modeWorker: N("Хочу работать", "Жұмыс істегім келеді", "I want to work"),
  catAll: N("Всё", "Барлығы", "All"),
  emptyFeed: N(
    "Пока нет задач в этой категории и районе — станьте первым, кто разместит объявление.",
    "Бұл санат пен аймақта әзірге тапсырма жоқ — алғашқы болып хабарландыру орналастырыңыз.",
    "No tasks in this category and area yet — be the first to post one."

/* location: {type:'oblast', raion, settlement|null, custom} */
function locLabel(loc) {
  if (!loc) return "";
  const r = findRaion(loc.raion);
  const rn = r ? L(r.n) : "";
  let sn = "";
  if (loc.settlement) { const s = findSettlement(loc.raion, loc.settlement); sn = s ? L(s.n) : ""; }
  else if (loc.custom) sn = loc.custom;
  return sn ? sn + " · " + rn : rn;
}

/* =====================================================================
   helpers
   ===================================================================== */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function money(n) { return Number(n || 0).toLocaleString(LOCALE[state.lang] || "ru-RU"); }
function $(id) { return document.getElementById(id); }
function nowTime() { return new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }

function bidsLabel(n) {
  if (state.lang === "kk") return n + " ұсыныс";
  if (state.lang === "en") return n === 1 ? "1 bid" : n + " bids";
  const m10 = n % 10, m100 = n % 100;
  const w = (m10 === 1 && m100 !== 11) ? "ставка" : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? "ставки" : "ставок";
  return n + " " + w;
}

function luhnValid(digits) {
  if (digits.length !== 16) return false;
  let sum = 0, alt = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = parseInt(digits[i], 10);
    if (alt) { d *= 2; if (d > 9) d -= 9; }
    sum += d; alt = !alt;
  }
  return sum % 10 === 0;
}
function cardNetworkKey(digits) {
  if (digits.charAt(0) === "4") return "visa";
  if (/^5[1-5]/.test(digits)) return "mc";
  if (/^2/.test(digits)) return "mir";
  return "card";
}
function netLabel(k) {
  if (k === "visa") return "Visa";
  if (k === "mc") return "Mastercard";
  if (k === "mir") return state.lang === "en" ? "Mir" : "МИР";
  return t("netCard");
}
function formatCardNumberDigits(d) { return d.replace(/(.{4})/g, "$1 ").trim(); }
function formatExpiryDigits(d) { return d.length >= 3 ? d.slice(0, 2) + "/" + d.slice(2) : d; }

function iconSvg(name, size) {
  size = size || 16;
  const common = 'width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"';
  const paths = {
    wrench: '<path d="M21 3a5 5 0 0 0-6.9 6.9L4 20l4 4 10.1-10.1A5 5 0 0 0 21 3Z"/>',
    hardhat: '<path d="M4 18v-2a8 8 0 0 1 16 0v2"/><path d="M2 18h20"/><path d="M12 8V4"/>',
    home: '<path d="m3 10 9-7 9 7"/><path d="M5 9v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M22 20c0-2.6-2-4.8-4.7-5.6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    check: '<path d="m4 12 6 6L20 6"/>',
    trenddown: '<path d="m3 7 7 7 4-4 7 7"/><path d="M15 17h6v-6"/>',
    trendup: '<path d="m3 17 7-7 4 4 7-7"/><path d="M15 7h6v6"/>',
    send: '<path d="m3 3 18 9-18 9 4-9-4-9Z"/>',
    x: '<path d="m5 5 14 14M19 5 5 19"/>',
    creditcard: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
    trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>'
  };
  return "<svg " + common + ">" + (paths[name] || "") + "</svg>";
}

function showFlash(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  const msg = t.apply(null, [key].concat(args));
  const el = $("flashRow");
  el.innerHTML = '<div class="flash">' + iconSvg("check", 14) + esc(msg) + "</div>";
  el.style.display = "block";
  clearTimeout(state.flashTimeout);
  state.flashTimeout = setTimeout(() => { el.style.display = "none"; el.innerHTML = ""; }, 2200);
}

/* =====================================================================
   language switching
   ===================================================================== */
function detectLang() {
  try { const s = localStorage.getItem("qolai_lang"); if (LANGS.indexOf(s) >= 0) return s; } catch (e) {}
  const nav = (navigator.language || "ru").toLowerCase();
  if (nav.indexOf("kk") === 0) return "kk";
  if (nav.indexOf("en") === 0) return "en";
  return "ru";
}

function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.getAttribute("data-i18n-ph")); });
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("lang-active", b.getAttribute("data-lang") === state.lang));
  $("offerHeaderBtn").setAttribute("aria-label", t("offerBtn"));
}

/* keep what the user already typed in the side panel when the language changes */
function snapshotSide() {
  const snap = {};
  document.querySelectorAll("#sidePanel [id]").forEach(el => { if ("value" in el) snap[el.id] = el.value; });
  return snap;
}
function restoreSide(snap) {
  const set = id => { const el = $(id); if (el && snap[id] !== undefined) el.value = snap[id]; };
  ["ntTitle", "ntCategory", "ntBudget", "ntPayment", "ntDescription", "bidWorker", "bidAmount", "bidNote", "pyName", "pyCategory", "pyDistrict"].forEach(set);
  if ($("ntRaion") && snap.ntRaion !== undefined) {
    set("ntRaion");
    populateSettlementOptions($("ntRaion").value);
    set("ntSettlement"); set("ntCustomSettlement"); onNtSettlementChange();
  }
}

function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t("docTitle");
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", t("docDesc"));
  applyStaticI18n();
  renderCatRow();
  renderFeed();
  renderSidePanel();
  renderCardList();
  renderOfferBody();
  updateCardHeaderButton();
  updatePyatakBadge();
  updateCardPreview();
  $("cardError").textContent = "";
}

function setLang(l) {
  if (LANGS.indexOf(l) < 0 || l === state.lang) return;
  const snap = snapshotSide();
  state.lang = l;
  try { localStorage.setItem("qolai_lang", l); } catch (e) {}
  applyLang();
  restoreSide(snap);
}

    .filter(x => x.loc.type === state.region)

  if (list.length === 0) { container.innerHTML = '<div class="empty-msg">' + esc(t("emptyFeed")) + "</div>"; return; }

    const min = amounts.length ? Math.min.apply(null, amounts) : null;
    const max = amounts.length ? Math.max.apply(null, amounts) : null;
    const isSel = state.selectedId === x.id;
    return '<div class="task-card' + (isSel ? " task-card-sel" : "") + '" onclick="selectTask(' + x.id + ')">' +
      '<div class="task-card-top">' +
        '<div class="task-card-main">' +
          '<div class="task-card-meta">' + iconSvg(cat ? cat.icon : "users", 14) +
            "<span>" + esc(catLabel(x.category)) + " · " + esc(locLabel(x.loc)) + "</span>" +
            (x.isMine ? '<span class="tag tag-slate">' + esc(t("tagMine")) + "</span>" : "") +
            (x.status === "closed" ? '<span class="tag tag-green">' + esc(t("tagClosed")) + "</span>" : "") +

          '<div class="task-card-title">' + esc(L(x.title)) + "</div>" +
        "</div>" +
        '<div class="task-card-price">' +
          '<div class="price-mono">' + money(x.budget) + " ₸</div>" +
          (min !== null ? '<div class="bids-hint">' + esc(bidsLabel(x.bids.length)) + ": " + money(min) + "–" + money(max) + " ₸</div>" : "") +
        "</div>" +

        esc(t("selectTaskText")) + "</div>" + buildWorkerPyatakBoxHtml() + "</div>";
    }

  }
  const x = state.tasks.find(y => y.id === state.selectedId);

  if (x.payment !== "cash") {
    const pc = state.cards.find(c => c.id === x.payment);
    if (pc) paymentLabel = netLabel(pc.net) + " •••• " + pc.last4;
  }

    else bidsHtml = '<div class="bids-list">' + x.bids.map(b => {
      const diff = b.amount - x.budget;

        ? '<span class="delta delta-neutral">' + esc(t("atBudget")) + "</span>"

      const accepted = x.acceptedBidId === b.id;
      const actionHtml = !x.acceptedBidId
        ? '<button class="btn-small" onclick="acceptBid(\'' + b.id + '\')">' + esc(t("accept")) + "</button>"
        : (accepted ? '<span class="accepted-mark">' + esc(t("selected")) + "</span>" : "");

      return '<div class="bid-row' + (accepted ? " bid-accepted" : "") + '">' +
        '<div class="bid-row-top"><span class="bid-worker">' + esc(L(b.worker)) + "</span>" + deltaHtml + "</div>" +
        '<div class="bid-amount">' + money(b.amount) + " ₸</div>" +
        (note ? '<div class="bid-note">' + esc(note) + "</div>" : "") + actionHtml +
      "</div>";
    }).join("") + "</div>";
    bodyHtml = '<div class="bids-title">' + esc(t("bidsTitle", x.bids.length)) + "</div>" + bidsHtml;
  } else {
    bodyHtml = '<div class="bids-title">' + esc(t("yourResponse")) + "</div>" +
      '<div class="form-col">' +
        '<div><label class="label">' + esc(t("yourName")) + '</label><input id="bidWorker" class="input" placeholder="' + esc(t("namePh")) + '"></div>' +

          '<div class="quick-row">' +
            '<button class="chip-btn" onclick="setBidAmount(' + x.budget + ')">' + esc(t("okWith", money(x.budget))) + "</button>" +
            '<button class="chip-btn" onclick="setBidAmount(' + Math.round(x.budget * 0.85) + ')">' + esc(t("cheaper15")) + "</button>" +

        "</div>" +

        '<button class="btn-amber" onclick="submitBid()">' + iconSvg("send", 14) + " " + esc(t("sendBid")) + "</button>" +
      "</div>";
  }

  box.innerHTML = '<div class="panel-inner">' +
    '<div class="detail-top">' +

    '<div class="detail-budget">' + esc(t("budget")) + " " + money(x.budget) + " ₸</div>" +
    '<div class="detail-payment">' + iconSvg("creditcard", 12) + " " + esc(t("payment")) + " " + esc(paymentLabel) + "</div>" +
    bodyHtml +
  "</div>";
}

function setBidAmount(v) { $("bidAmount").value = v; }

function submitBid() {
  const x = state.tasks.find(y => y.id === state.selectedId);
  if (!x) return;
  const worker = $("bidWorker").value.trim();
  const amount = $("bidAmount").value;
  if (!worker || !amount) { showFlash("flashNeedNamePrice"); return; }
  x.bids.push({ id: "b" + Date.now(), worker: worker, amount: Number(amount), note: $("bidNote").value.trim(), time: nowTime() });
  $("bidWorker").value = ""; $("bidAmount").value = ""; $("bidNote").value = "";
  renderFeed();
  showFlash("flashBidSent");
}

function acceptBid(bidId) {
  const x = state.tasks.find(y => y.id === state.selectedId);
  if (!x) return;
  x.acceptedBidId = bidId; x.status = "closed";
  renderFeed(); renderSidePanel();
  showFlash("flashAccepted");
}

  if (!title || !budget) { showFlash("flashNeedTitlePrice"); return; }
  const raion = $("ntRaion").value;
  const sv = $("ntSettlement").value;
  let loc;
  if (sv === OTHER_SETTLEMENT) {
    const custom = $("ntCustomSettlement").value.trim();
    if (!custom) { showFlash("flashNeedSettlement"); return; }
    loc = { type: "oblast", raion: raion, settlement: null, custom: custom };
  } else {
    loc = { type: "oblast", raion: raion, settlement: sv, custom: "" };
  }
  const task = {
    id: Date.now(), title: title, category: $("ntCategory").value, loc: loc, budget: Number(budget),
    description: $("ntDescription").value.trim(), payment: $("ntPayment").value,
    isMine: true, status: "open", acceptedBidId: null, bids: []
  };
  state.tasks.unshift(task);
  state.selectedId = task.id;
  renderFeed(); renderSidePanel(); updatePyatakBadge();
  showFlash("flashTaskPosted");
}

/* =====================================================================
   Пятак
   ===================================================================== */
function buildPyatakWidgetHtml() {
  const list = state.pyatak
    .filter(p => p.loc.type === state.region)
    .filter(p => state.catFilter === "all" || p.category === state.catFilter);
  const rows = list.length === 0
    ? '<div class="muted">' + esc(t("pyNobody")) + "</div>"
    : list.map(p =>
        '<div class="pyatak-row">' +
          '<div class="pyatak-row-main">' +
            '<div class="pyatak-name">' + esc(L(p.name)) + "</div>" +
            '<div class="pyatak-meta">' + esc(catLabel(p.category)) + " · " + esc(locLabel(p.loc)) + " · " + esc(t("pySince", p.time)) + "</div>" +
          "</div>" +
          '<button class="chip-btn" onclick="callFromPyatak(\'' + p.id + '\')">' + esc(t("pyCall")) + "</button>" +
        "</div>").join("");
  return '<div class="pyatak-widget">' +
    '<div class="panel-title" style="font-size:15px; margin-bottom:2px">🪙 ' + esc(t("pyWidgetTitle", list.length)) + "</div>" +
    '<div class="panel-sub" style="margin-bottom:0">' + esc(t("pyWidgetSub")) + "</div>" +
    '<div class="pyatak-list">' + rows + "</div>" +
  "</div>";
}

function buildWorkerPyatakBoxHtml() {
  if (state.myPyatakId) {
    const mine = state.pyatak.find(p => p.id === state.myPyatakId);
    return '<div class="pyatak-box">' +
      '<div class="panel-title" style="margin-bottom:6px">🪙 ' + esc(t("pyBoxTitle")) + "</div>" +
      '<div class="pyatak-status">' + esc(t("pyStatus", mine ? catLabel(mine.category) : "", mine ? locLabel(mine.loc) : "", mine ? mine.time : "")) + "</div>" +
      '<button class="btn-small" onclick="leavePyatak()">' + esc(t("pyLeave")) + "</button>" +
    "</div>";
  }
  const districtOptionsHtml = optionsHtml(OBLAST_DISTRICTS, r => L(r.n));
  return '<div class="pyatak-box">' +
    '<div class="panel-title" style="margin-bottom:2px">🪙 ' + esc(t("pyBoxTitle")) + "</div>" +
    '<div class="panel-sub">' + esc(t("pyBoxSub")) + "</div>" +
    '<div class="form-col">' +
      '<div><label class="label">' + esc(t("yourName")) + '</label><input id="pyName" class="input" placeholder="' + esc(t("namePh")) + '"></div>' +
      '<div><label class="label">' + esc(t("category")) + '</label><select id="pyCategory" class="input">' + optionsHtml(CATEGORIES, c => L(c.label)) + "</select></div>" +
      '<div><label class="label">' + esc(t("pyDistrictOblast")) + '</label><select id="pyDistrict" class="input">' + districtOptionsHtml + "</select></div>" +
      '<button class="btn-primary" onclick="joinPyatak()">' + esc(t("pyJoin")) + "</button>" +
    "</div>" +
  "</div>";
}

function joinPyatak() {
  const name = $("pyName").value.trim();
  if (!name) { showFlash("flashNeedName"); return; }
  const did = $("pyDistrict").value;
  const entry = {
    id: "p" + Date.now(), name: name, category: $("pyCategory").value,
    loc: oblLoc(did, null), time: nowTime()
  };
  state.pyatak.unshift(entry);
  state.myPyatakId = entry.id;
  renderSidePanel(); updatePyatakBadge();
  showFlash("flashPyIn");
}

function leavePyatak() {
  state.pyatak = state.pyatak.filter(p => p.id !== state.myPyatakId);
  state.myPyatakId = null;
  renderSidePanel(); updatePyatakBadge();
  showFlash("flashPyOut");
}

function callFromPyatak(id) {
  const p = state.pyatak.find(x => x.id === id);
  if (!p) return;
  setMode("client");
  $("ntTitle").value = t("pyUrgent", L(p.name));
  $("ntCategory").value = p.category;
  $("ntRaion").value = p.loc.raion;
  populateSettlementOptions(p.loc.raion);
  showFlash("flashPrefilled", L(p.name));
}

/* =====================================================================
   card modal
   ===================================================================== */
function openCardModal() {
  $("cardModalCloseBtn").innerHTML = iconSvg("x", 18);
  $("cardModalOverlay").style.display = "flex";
  renderCardList();
  updateCardPreview();
}
function closeCardModal() {
  $("cardModalOverlay").style.display = "none";
  $("cardError").textContent = "";
}

function updateCardPreview() {
  const digits = $("cardNumber").value.replace(/\D/g, "").slice(0, 16);
  $("previewNumber").textContent = digits ? formatCardNumberDigits(digits) : "•••• •••• •••• ••••";
  $("previewExpiry").textContent = $("cardExpiry").value || t("previewExpiry");
  $("previewName").textContent = $("cardName").value || t("previewName");
}
function onCardNumberInput() {
  const el = $("cardNumber");
  el.value = formatCardNumberDigits(el.value.replace(/\D/g, "").slice(0, 16));
  updateCardPreview();
}
function onCardExpiryInput() {
  const el = $("cardExpiry");
  el.value = formatExpiryDigits(el.value.replace(/\D/g, "").slice(0, 4));
  updateCardPreview();
}
function onCardCvcInput() {
  const el = $("cardCvc");
  el.value = el.value.replace(/\D/g, "").slice(0, 3);
}

function renderCardList() {
  const box = $("cardListBox");
  if (state.cards.length === 0) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="card-list">' + state.cards.map(c =>
    '<div class="card-row">' +
      '<button class="card-row-main" onclick="setDefaultCard(\'' + c.id + '\')">' +
        iconSvg("creditcard", 16) +
        "<div>" +
          '<div class="card-row-title">' + esc(netLabel(c.net)) + " •••• " + c.last4 +
            (state.defaultCardId === c.id ? ' <span class="default-tag">· ' + esc(t("defaultTag")) + "</span>" : "") + "</div>" +
          '<div class="card-row-sub">' + esc(c.name) + " · " + esc(t("validUntil", c.expiry)) + "</div>" +
        "</div>" +
      "</button>" +
      '<button class="icon-btn danger" onclick="removeCard(\'' + c.id + '\')">' + iconSvg("trash", 15) + "</button>" +
    "</div>").join("") + "</div>";
}

function setDefaultCard(id) { state.defaultCardId = id; renderCardList(); updateCardHeaderButton(); }

function refreshPaymentSelectIfPresent(selectId) {
  const sel = $("ntPayment");
  if (!sel) return;
  const was = sel.value;
  sel.innerHTML = paymentOptionsHtml();
  if (selectId) sel.value = selectId;
  else sel.value = state.cards.some(c => c.id === was) ? was : "cash";
}

function addCard() {
  const err = $("cardError");
  err.textContent = "";
  const digits = $("cardNumber").value.replace(/\D/g, "");
  if (digits.length !== 16 || !luhnValid(digits)) { err.textContent = t("errNumber"); return; }
  const expiry = $("cardExpiry").value;
  const parts = expiry.split("/");
  const mm = parts[0], yy = parts[1];
  if (!mm || !yy || mm.length !== 2 || yy.length !== 2 || Number(mm) < 1 || Number(mm) > 12) { err.textContent = t("errExpiry"); return; }
  if ($("cardCvc").value.length !== 3) { err.textContent = t("errCvc"); return; }
  const name = $("cardName").value.trim();
  if (!name) { err.textContent = t("errName"); return; }

  const card = { id: "c" + Date.now(), last4: digits.slice(-4), net: cardNetworkKey(digits), expiry: expiry, name: name };
  state.cards.push(card);
  if (!state.defaultCardId) state.defaultCardId = card.id;

  ["cardNumber", "cardExpiry", "cardCvc", "cardName"].forEach(id => { $(id).value = ""; });
  updateCardPreview();
  closeCardModal();
  updateCardHeaderButton();
  refreshPaymentSelectIfPresent(card.id);
  showFlash("flashCardLinked");
}

function removeCard(id) {
  state.cards = state.cards.filter(c => c.id !== id);
  if (state.defaultCardId === id) state.defaultCardId = state.cards.length ? state.cards[0].id : null;
  renderCardList();
  updateCardHeaderButton();
  refreshPaymentSelectIfPresent(null);
}

/* =====================================================================
   init
   ===================================================================== */
function init() {
  state.lang = detectLang();
  $("offerHeaderIcon").innerHTML = iconSvg("doc", 15);
  applyLang();
}
init();
</script>
</body>
